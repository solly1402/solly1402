name: Daily confession

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

jobs:
  confess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick today's confession
        run: python scripts/confession.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet || (git commit -m "Daily confession" && git push)
