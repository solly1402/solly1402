<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
  <defs>
    <linearGradient id="ai" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="55" height="30" width="220"><animate attributeName="width" from="220" to="420" begin="0.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="125" height="30" width="220"><animate attributeName="width" from="220" to="420" begin="2.4s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="295" height="30" width="220"><animate attributeName="width" from="220" to="420" begin="6.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 16px; fill: #c9d1d9; }
    .u { fill: #3fb950; font-weight: bold; }
    .p { fill: #58a6ff; font-weight: bold; }
    .o { fill: #e6edf3; }
    .m { fill: #8b949e; font-style: italic; }
    .y { fill: #f2cc60; }
    .k { fill: #f472b6; font-weight: bold; }
  </style>

  <!-- window -->
  <rect width="820" height="440" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M12 0 H808 A12 12 0 0 1 820 12 V36 H0 V12 A12 12 0 0 1 12 0 Z" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" style="font-size:13px;fill:#8b949e">solly1402@github: ~ (zsh)</text>

  <!-- L1: whoami -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>
    <text x="24" y="76" clip-path="url(#c1)"><tspan class="u">solly1402@github</tspan>:<tspan class="p">~</tspan>$ whoami</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/>
    <text x="24" y="104" class="o">Son Nguyen - skidder</text>
  </g>

  <!-- L2: skills -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.1s" fill="freeze"/>
    <text x="24" y="146" clip-path="url(#c2)"><tspan class="u">solly1402@github</tspan>:<tspan class="p">~</tspan>$ cat skills.txt</text>
  </g>

  <g opacity="0"><set attributeName="opacity" to="1" begin="3.6s" fill="freeze"/>
    <text x="24" y="182" class="y">Python</text>
    <rect x="170" y="169" width="420" height="14" rx="7" fill="#21262d"/>
    <rect x="170" y="169" width="0" height="14" rx="7" fill="#3776ab"><animate attributeName="width" from="0" to="6" begin="3.7s" dur="0.6s" fill="freeze"/></rect>
    <text x="610" y="182">0.5%</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/>
    <text x="24" y="212" class="y">JavaScript</text>
    <rect x="170" y="199" width="420" height="14" rx="7" fill="#21262d"/>
    <rect x="170" y="199" width="0" height="14" rx="7" fill="#f7df1e"><animate attributeName="width" from="0" to="6" begin="4s" dur="0.6s" fill="freeze"/></rect>
    <text x="610" y="212">0.5%</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/>
    <text x="24" y="242" class="k">A.I</text>
    <rect x="170" y="229" width="420" height="14" rx="7" fill="#21262d"/>
    <rect x="170" y="229" width="0" height="14" rx="7" fill="url(#ai)"><animate attributeName="width" from="0" to="416" begin="4.3s" dur="1.6s" fill="freeze"/></rect>
    <text x="610" y="242" class="k">99%</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/>
    <text x="24" y="274" class="m"># human skill: 1%  |  AI skill: 99%  |  honesty: 100%</text>
  </g>

  <!-- L3: motto -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="6.4s" fill="freeze"/>
    <text x="24" y="316" clip-path="url(#c3)"><tspan class="u">solly1402@github</tspan>:<tspan class="p">~</tspan>$ echo $MOTTO</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/>
    <text x="24" y="344" class="o">"wtf ?"</text>
  </g>

  <!-- L4: cursor -->
  <g opacity="0"><set attributeName="opacity" to="1" begin="8.4s" fill="freeze"/>
    <text x="24" y="386"><tspan class="u">solly1402@github</tspan>:<tspan class="p">~</tspan>$</text>
    <rect x="220" y="372" width="10" height="18" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
